    kw:["抽象","觉察","困惑","启发"], emoji:"🌀"
  }
];

var TOTAL = 36;
var CK_NAME = {indiv:"个体人回路 · 知晓", logic:"集体人回路 · 理解（逻辑/抽象）", tribal:"家族回路 · 部落"};
var CN_NUM  = ["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩","⑪","⑫","⑬","⑭","⑮","⑯","⑰","⑱","⑲","⑳",
               "㉑","㉒","㉓","㉔","㉕","㉖","㉗","㉘","㉙","㉚","㉛","㉜","㉝","㉞","㉟","㊱"];

/* ================== 渲染层 ================== */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function cardHTML(ch){
  var gates = ch.gates.map(function(x){
    return '<div class="gate">'
      + '<div class="gn">闸门 ' + x.g + '</div>'
      + '<div class="gx">' + esc(x.hex) + '</div>'
      + '<div class="gl">' + esc(x.label) + '</div>'
      + '</div>';
  }).join('<div class="link"><span>⇄</span><div class="ln"></div></div>');

  return '<article class="card" data-ck="' + ch.ck + '">'
    + '<div class="top">'
    +   '<div class="num"><small>通道</small>' + CN_NUM[ch.no-1] + '</div>'
    +   '<div><h2>' + esc(ch.name) + '<span class="gates">' + esc(ch.id) + '</span></h2>'
    +   '<div class="design">' + esc(ch.design) + '</div></div>'
    +   '<div class="emoji">' + ch.emoji + '</div>'
    + '</div>'
    + '<div class="meta">'
    +   '<span class="chip ck">' + esc(CK_NAME[ch.ck]) + '</span>'
    +   '<span class="chip">⚡ ' + esc(ch.centers) + '</span>'
    + '</div>'
    + '<div class="gaterow">' + gates + '</div>'
    + '<p class="para"><span class="lead">天赋描述</span>' + esc(ch.paras[0]) + '</p>'
    + '<p class="para"><span class="lead">活出天赋</span>' + esc(ch.paras[1]) + '</p>'
    + '<div class="kw"><span class="kt">关键词</span>' + ch.kw.map(function(k){return '<i>' + esc(k) + '</i>';}).join('') + '</div>'
    + '</article>';
}

function render(filter){
  var box = document.getElementById("cards");
  var html = "";
  CHANNELS.forEach(function(ch){
    if(!filter || filter==="all" || ch.ck===filter) html += cardHTML(ch);
  });
  if(!html) html = '<div class="todo">该回路暂无卡片</div>';
  box.innerHTML = html;
}

function renderFilters(){
  var fs = [
    {k:"all", t:"全部"},
    {k:"indiv", t:"个体人·知晓"},
    {k:"logic", t:"集体人·理解/抽象"},
    {k:"tribal", t:"家族·部落"}
  ];
  var box = document.getElementById("filters");
  box.innerHTML = fs.map(function(f,i){
    return '<button data-k="' + f.k + '" class="' + (i===0?"on":"") + '">' + f.t + '</button>';
  }).join("");
  box.addEventListener("click", function(e){
    var b = e.target.closest("button");
    if(!b) return;
    box.querySelectorAll("button").forEach(function(x){x.classList.remove("on");});
    b.classList.add("on");
    render(b.getAttribute("data-k"));
  });
}

function init(){
  document.title = "36条天赋通道知识卡片 · " + VERSION;
  document.getElementById("verBadge").textContent = "全本 " + VERSION + " · 36/36 完成";
  document.getElementById("progBar").style.width = "100%";
  document.getElementById("progTxt").textContent = "已完成 36 / 36 条（全本完成）";
  document.getElementById("foot").innerHTML =
    '资料来源：人类图标准 36 通道知识<br>'
    + '<span class="src">闸门卦名为易经常识补充 · 仅供学习参考</span><br>'
    + 'Powered by Kan Man Tang';
  renderFilters();
  render("all");
}

window.addEventListener("DOMContentLoaded", init);
</script>
