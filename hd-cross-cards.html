  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function gateCell(role, num, nm, th, d, cls) {
  if (!num) return '';
  return '<div class="gcell ' + cls + '">'
    + '<div class="role">' + role + '</div>'
    + '<div class="gn">' + num.replace('号闸门', '') + ' <em>' + esc(nm) + '</em></div>'
    + '<div class="gt">「' + esc(th) + '」</div>'
    + '<div class="gd">' + esc(d) + '</div>'
    + '</div>';
}
function cardHTML(c) {
  return '<article class="card" data-angle="' + c.angleKey + '" data-idx="' + c.idx + '">'
    + '<div class="top">'
    +   '<div class="num"><small>太阳闸门</small>' + c.g + '</div>'
    +   '<div><h2>' + esc(c.full) + '<span class="gates">' + esc(c.gatesStr) + '</span></h2>'
    +   '<div class="design">' + (c.quarter ? c.quarter.icon + ' ' + esc(c.quarter.n) + ' · ' + esc(c.quarter.t) : '') + '</div></div>'
    +   '<div class="emoji">' + c.angleIcon + '</div>'
    + '</div>'
    + '<div class="meta">'
    +   '<span class="chip ck">' + esc(c.angleLabel) + ' · ' + esc(c.angleTag) + '</span>'
    +   '<span class="chip">' + esc(c.angleLine) + '</span>'
    +   (c.quarter ? '<span class="chip">' + esc(c.quarter.e) + '</span>' : '')
    + '</div>'
    + '<div class="g4">'
    +   gateCell('意识 · 人格太阳', c.psun, c.psunName, c.psunTh, c.psunD, 'c-sun')
    +   gateCell('意识 · 人格地球', c.pearth, c.pearthName, c.pearthTh, c.pearthD, 'c-sun')
    +   gateCell('潜意识 · 设计太阳', c.dsun, c.dsunName, c.dsunTh, c.dsunD, 'c-design')
    +   gateCell('潜意识 · 设计地球', c.dearth, c.dearthName, c.dearthTh, c.dearthD, 'c-design')
    + '</div>'
    + '<p class="para"><span class="lead">生命主题</span>' + esc(c.theme) + '</p>'
    + '<p class="para"><span class="lead">使命注解</span>' + esc(c.summary) + '</p>'
    + '<div class="kw"><span class="kt">四闸门课题</span>' + c.themes.map(function(k) { return '<i>' + esc(k) + '</i>'; }).join('') + '</div>'
    + '</article>';
}

function render(){
  var box = document.getElementById("cards");
  var html = "";
  CROSSES.forEach(function(c){
    if(curAngle !== "all" && c.angleKey !== curAngle) return;
    if(curQuarter !== "all" && (!c.quarter || c.quarter.n !== curQuarter)) return;
    html += cardHTML(c);
  });
  box.innerHTML = html;
  var shown = box.querySelectorAll(".card").length;
  document.getElementById("progTxt").textContent = "当前显示 " + shown + " / 192 种轮回交叉";
}

function renderFilters(){
  var box = document.getElementById("filters");
  box.innerHTML = ANGLE_TABS.map(function(f,i){
    return '<button data-t="angle" data-k="' + f.k + '" class="' + (i===0?"on":"") + '">' + f.t + '</button>';
  }).join("") + "<br>" + QUARTER_TABS.map(function(f){
    return '<button data-t="quarter" data-k="' + f.k + '" class="' + (f.k==="all"?"on":"") + '">' + f.t + '</button>';
  }).join("");
  box.addEventListener("click", function(e){
    var b = e.target.closest("button");
    if(!b) return;
    var type = b.getAttribute("data-t"), k = b.getAttribute("data-k");
    box.querySelectorAll('button[data-t="' + type + '"]').forEach(function(x){x.classList.remove("on");});
    b.classList.add("on");
    if(type === "angle") curAngle = k; else curQuarter = k;
    render();
  });
}

function init(){
  document.title = "192 轮回交叉知识卡片 · " + VERSION;
  document.getElementById("verBadge").textContent = "全本 " + VERSION + " · 192/192 完成";
  document.getElementById("progBar").style.width = "100%";
  document.getElementById("foot").innerHTML =
    "192 轮回交叉 · 此生行走的专属道路<br>" +
    '<span class="src">资料来源：人类图 192 种轮回交叉数据库（Ra Uru Hu / Chetan Parkyn《人类图轮回交叉全书》）</span><br>' +
    '<span class="src">Powered by Kan Man Tang</span>';
  renderFilters();
  render();
}
init();
</script>

</html>
