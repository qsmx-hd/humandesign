"🗣️"},{"id":13,"name":"倾听者的秘密力量","nameEn":"The Listener","iching":"同人 · 同众","center":"G中心","circuitKey":"logic","circuitLabel":"集体人回路 · 感知","design":"天生的倾听者，是人类故事与历史的守护者，持有他人秘密","talent":"闸门13是\"倾听者的秘密力量\"，Ra称其为\"倾听者\"。你听到的不是故事，而是灵魂的低语。","practice":"当这股能量被定义时，你会稳定地活出倾听；当未定义时，你会在特定环境中\"感受到\"这股能量，但它不是你恒定的状态。等待正确的邀请或时机，让倾听自然通过你而显现。不要试图\"努力变得倾听\"，那只会造成紧绷和挫败。✦ 倾听不是你\"做\"出来的，而是你是什么的自然显现。","channel":"13-33 浪子通道","oppId":33,"oppIching":"遁 · 退隐","keywords":["倾听","秘密","故事","记忆","同理心"],"emoji":"✨"},{"id":14,"name":"驱动人生方向的动力燃料","nameEn":"Power Skills","iching":"大有 · 大有所成","center":"荐骨中心","circuitKey":"indiv","circuitLabel":"个体人回路 · 觉知","design":"是生命的「钥匙」，提供驱动人生方向所需的动力燃料与物质资源","talent":"闸门14是\"驱动人生方向的动力燃料\"，Ra称其为\"燃料\"。没有闸门14的能量，梦想只是梦想，无法被实现。","practice":"认识这股能量的本质——它不是你需要\"努力变得更好\"的东西，而是你已经拥有的潜能。等待它的自然显现，而不是用意志去驱动它。✦ 当这股能量来自于你的本性时，它才有真正的力量。","channel":"2-14 脉动通道","oppId":2,"oppIching":"坤 · 受 · 纯阴","keywords":["动力","财富","资源","繁荣","引擎"],"emoji":"🔥"},{"id":15,"name":"极端中的谦逊与人类之爱","nameEn":"Extremes","iching":"谦 · 谦卑","center":"G中心","circuitKey":"logic","circuitLabel":"集体人回路 · 理解","design":"拥抱所有节奏与行为的极端，以博大的爱包容人类多样性","talent":"闸门15是\"极端中的谦逊\"，Ra称其为\"人类之爱\"。在多样性中找到统一，在极端中找到平衡。","practice":"当这股能量被定义时，你会稳定地活出极端；当未定义时，你会在特定环境中\"感受到\"这股能量，但它不是你恒定的状态。等待正确的邀请或时机，让极端自然通过你而显现。不要试图\"努力变得极端\"，那只会造成紧绷和挫败。✦ 极端不是你\"做\"出来的，而是你是什么的自然显现。","channel":"5-15 韵律通道","oppId":5,"oppIching":"需 · 等待 · 营养","keywords":["极端","人类之爱","节奏","多样性","包容"],"emoji":"✨"},{"id":16,"name":"技能与热忱的精通之路","nameEn":"Skills / Enthusiasm","iching":"豫 · 豫悦","center":"喉轮中心","circuitKey":"logic","circuitLabel":"集体人回路 · 理解","design":"透过反复练习与热忱来精通技能，是才华转化为实际表达的力量","talent":"闸门16是\"技能与热忱的精通之路\"，Ra称其为\"精通者\"。技能需要被磨练，热忱需要被找到。","practice":"喉轮中心是九个中心中唯一\"显化\"的中心——想法、感受、直觉都需要通过喉轮才能被世界看见。等待内在的正确信号（来自你的权威中心）再表达。当信号清晰时，果断说出来；当信号不清晰时，保持沉默是更有力量的选择。✦ 你的表达是礼物，但不是每时每刻都需要送出。","channel":"16-48 波长通道","oppId":48,"oppIching":"井 · 井水","keywords":["技能","热忱","精通","实验","才能"],"emoji":"🗣️"},{"id":17,"name":"逻辑意见的组织力量","nameEn":"Following / Opinions","iching":"随 · 随从","center":"逻辑头脑","circuitKey":"logic","circuitLabel":"集体人回路 · 理解","design":"是逻辑意见与模式识别的中心，透过组织观点来为集体提供参考框架","talent":"闸门17是\"逻辑意见的组织力量\"，Ra称其为\"意见者\"。好的意见来自对健康模式的理解。","practice":"脑中心不是「觉知」的中心，而是「思维加工」的中心。定义的脑中心拥有稳定的思考模式；未定义的则会吸收他人的思考压力，容易陷入\"过度思考\"。闸门17的意见需要被充分思考成熟后再表达。不要在有压力时急于得出结论。给你的思维充分的时间，让它自然地沉淀出答案。✦ 思考本身不是问题，问题是用思考来代替内在权威做决定。","channel":"17-62 接纳通道","oppId":62,"oppIching":"小过 · 小事谨慎","keywords":["意见","逻辑","组织","未来","预测"],"emoji":"🧠"},{"id":18,"name":"纠正与改善的品味力量","nameEn":"Work on What Has Been Spoiled","iching":"蛊 · 整治败坏","center":"直觉中心","circuitKey":"logic","circuitLabel":"集体人回路 · 理解","design":"对不完美有敏锐的觉知，透过批判与纠正来推动事物走向最佳状态","talent":"闸门18是\"纠正与改善的品味力量\"，Ra称其为\"品味者\"。你能看到什么是\"不对的\"，但智慧在于如何纠正。","practice":"直觉中心的智慧是「就是知道」——不需要思考，不需要验证，在当下的瞬间，身体就是知道。当直觉出现时， 立即行动。直觉中心的能量稍纵即逝，如果你停下来\"思考\"，它就已经消失了。闸门18的纠正需要在直觉出现的当下就被信任和跟随。✦ 不要用大脑去\"验证\"直觉。直觉不需要被证明，它只需要被跟随。","channel":"18-58 批判通道","oppId":58,"oppIching":"兑 · 喜悦","keywords":["纠正","品味","批判","改善","完美"],"emoji":"🛡️"},{"id":19,"name":"靠近与想要的敏感力量","nameEn":"Approach / Wanting","iching":"临 · 临近","center":"根部中心","circuitKey":"tribal","circuitLabel":"家族人回路 · 防护","design":"对人类基本需求有极度敏感的感知，透过靠近来建立安全感与归属感","talent":"闸门19是\"靠近与想要的敏感力量\"，Ra称其为\"探索者\"。你想要什么不是问题，问题是：你想要的东西是否对你正确。","practice":"根部中心的压力不是\"问题\"，而是\"燃料\"——它推动你采取行动、完成任务。定义的根部拥有稳定的压力驱动力；未定义的则会吸收他人的压力，容易感到\"我必须快点\"。闸门19的智慧在于：学会与压力共舞 ，而不是被压力逼促。当压力来临时，深呼吸，连接到你的内在权威，问：「这个压力是来自我的真实，还是来自外在的期待？」✦ 压力本身不是坏事，关键是你是否与它建立了正确的关系。","channel":"19-49 综合通道","oppId":49,"oppIching":"革 · 革命","keywords":["需求","敏感","靠近","资源","情感"],"emoji":"⚡"},{"id":20,"name":"活在当下的存在力量","nameEn":"The Now","iching":"观 · 观察","center":"喉轮中心","circuitKey":"indiv","circuitLabel":"个体人回路 · 觉知","design":"活在纯粹的当下，将内在觉知直接化为语言与行动的表达力量","talent":"闸门20是\"活在当下的存在力量\"，Ra称其为\"现在\"。你不需要计划，你只需要在每个\"现在\"中完全存在。","practice":"喉轮中心是九个中心中唯一\"显化\"的中心——想法、感受、直觉都需要通过喉轮才能被世界看见。个体回路的表达以脉冲方式出现。当能量开启时，表达是清晰而有力的；当能量关闭时，安静地等待。不要在\"关闭\"期强迫自己表达，那只会说出不成熟的话。✦ 你的表达是礼物，但不是每时每刻都需要送出。","channel":"20-34 魅力通道 / 20-57 脑波通道 / 10-20 觉醒通道","oppI 落在合作关系中的天然雷达","talent":"闸门44「本能记忆的警觉力量」位于直觉中心 ，属于部落回路 → 意志力回路。透过本能的警觉感知过去的模式，是部落在合作关系中的天然雷达","practice":"直觉中心的智慧是「就是知道」——不需要思考，不需要验证，在当下的瞬间，身体就是知道。当直觉出现时， 立即行动。直觉中心的能量稍纵即逝，如果你停下来\"思考\"，它就已经消失了。闸门44的本能需要在直觉出现的当下就被信任和跟随。✦ 不要用大脑去\"验证\"直觉。直觉不需要被证明，它只需要被跟随。","channel":"26-44 臣服通道","oppId":26,"oppIching":"大畜 · 大积累","keywords":["本能","记忆","警觉","过去","模式"],"emoji":"🛡️"},{"id":45,"name":"聚集的统治力量","nameEn":"The Gatherer","iching":"萃 · 聚集","center":"喉轮中心","circuitKey":"tribal","circuitLabel":"家族人回路 · 意志力","design":"是部落的国王或女王，透过聚集与分配资源来统治并教育集体","talent":"闸门45位于喉轮中心，是「聚集（Gathering）」的力量。Ra 说：闸门45的天赋在于「将人群、资源和注意力聚集到一起」。它与闸门21（掌控资源的意志力量）共同组成「21-45 金钱通道」。闸门45的「聚集」不是为了个人享乐，而是为了「服务集体」。当你的品质足够清晰时，人们会自然而然地聚集过来——你不需要「主动去聚集」。","practice":"喉轮中心是九个中心中唯一\"显化\"的中心——想法、感受、直觉都需要通过喉轮才能被世界看见。等待内在的正确信号（来自你的权威中心）再表达。当信号清晰时，果断说出来；当信号不清晰时，保持沉默是更有力量的选择。✦ 你的表达是礼物，但不是每时每刻都需要送出。","channel":"21-45 金钱通道","oppId":21,"oppIching":"噬嗑 · 咬断","keywords":["统治","聚集","教育","资源","分配"],"emoji":"🗣️"},{"id":46,"name":"机缘与身体之爱的力量","nameEn":"Serendipity","iching":"升 · 上升","center":"G中心","circuitKey":"logic","circuitLabel":"集体人回路 · 感知","design":"对身体与物质存在充满喜悦，透过「对的时机」在正确的地方遇见美好","talent":"闸门46位于G中心，是「机缘（The Love of Body）」的力量。Ra 说：这是关于「身体之爱」的闸门——不是情欲，而是「身体知道什么是愉悦和正确」的天然智慧。闸门46与闸门29（对生命说是的承诺力量）共同组成「29-46 发现通道」。29号提供「对生命的承诺」，46号提供「身体之爱的愉悦表达」。这两条能量结合，让个人在全心承诺投入某件事时，身体会自然地找到最愉悦和正确的表达方式。","practice":"闸门46的「机缘」是身体层面的 ，不是大脑的思考结果。当你在正确的事情上投入时，你的身体会「就是知道」这是愉悦和正确的。定义的G中心拥有稳定的方向感；未定义的G中心则会在环境中吸收他人的方向感，容易感到「我必须找到我的机缘」的压力。真正的机缘是「在正确的事情上，身体自然感到愉悦」 ，而非「大脑规划出来的目标」。","channel":"29-46 发现通道","oppId":29,"oppIching":"坎 · 深渊","keywords":["机缘","身体之爱","运气","存在","喜悦"],"emoji":"✨"},{"id":47,"name":"压抑与领悟的智慧力量","nameEn":"The Gate of Realization","iching":"困 · 困境","center":"逻辑头脑","circuitKey":"logic","circuitLabel":"集体人回路 · 感知","design":"在困境与压抑之后找到生命的意义，是回顾过去体验并领悟智慧的力量","talent":"闸门47位于逻辑头脑（Ajna），是「压抑（Oppression）」的力量。Ra 说：逻辑头脑的压力往往让人「想太多却得不出结论」，而闸门47的「压抑」是「为了获得领悟而经历的思维黑暗期」。闸门47与闸门64（在困惑中寻找灵感的源泉）共同组成「47-64 抽象通道」，位于逻辑头脑内部。这两条能量让个人能在思维的困惑与压抑中，等待并捕捉突然涌现的抽象灵感，并将其转化为理解。","practice":"闸门47的「压抑」不是「脑子有问题」，而是「领悟之前的必要过程」。就像种子在黑暗的土壤中酝酿，逻辑思维也需要在「不知道」的状态中酝酿，才能涌现出真正的领悟。定义的闸门47拥有稳定的「领悟节奏」；未定义的则会吸收环境中他人的思维压力，容易感到「我必须想出答案」的焦虑。智慧在于：允许自己「不知道」，并信任领悟会在正确的时刻自然浮现。","channel":"47-64 抽象通道","oppId":64,"oppIching":"未济 · 未完成","keywords":["压抑","领悟","回顾","意义","混乱"],"emoji":"🧠"},{"id":48,"name":"井的深度与智慧","nameEn":"The Well","iching":"井 · 井水","center":"直觉中心","circuitKey":"logic","circuitLabel":"集体人回路 · 理解","design":"是深不可测的智慧之井，对自身资源有天然的不足感，推动持续深化","talent":"闸门48位于直觉中心（Spleen），是「井（The Well）」的智慧。Ra 说：直觉中心是关于「生存、免疫与直觉觉知」的中心，而闸门48的天赋在于「拥有深度的智慧，就像一口深井」——你不需要「广泛涉猎」，但你在某个领域的深度是他人无法达到的。闸门48与闸门16（技能与热忱的精通之路）共同组成「16-48 波长通道」。16号产生「技能与热忱」，48号提供「井的深度与智慧」。这两条能量结合，让个人在追求技能精通的过程中，能与真正有深度的智慧产生共鸣，并以自己的方式传递下去。","practice":"闸门48的天赋在于「深度」，而非「广度」。就像一口井——它不需要覆盖很大的面积，但它的深度是他人无法达到的。定义的直觉中心拥有稳定的直觉深度；未定义的则会吸收环境中他人的「深度压力」，容易感到「我的理解不够深」的压力。智慧在于：允许自己在某个领域深入到底，而非试图广泛涉猎所有领域。","channel":"16-48 波长通道","oppId":16,"oppIching":"豫 · 豫悦","keywords":["深度","智慧","不足感","技能","资源"],"emoji":"🛡️"},{"id":49,"name":"原则与革命的力量","nameEn":"The Gate of Revolution","iching":"革 · 革命","center":"情绪中心","circuitKey":"tribal","circuitLabel":"家族人回路 · 防护","design":"基于原则来接受或拒绝，是部落关系中具有革命性变革力量的守护者","talent":"闸门49位于情绪中心，是「原则（Principles）」的力量。Ra 说：情绪中心是关于「情绪的波浪式运作」的中心，而闸门49的天赋在于「为了守护某种原则而愿意革命」。闸门49与闸门19（靠近与想要的敏感力量）共同组成「19-49 综合通道」。19号提供「对部落需求的敏感」，49号提供「原则的守护」。这两条能量结合，让个人对部落（家庭/社群）的需求有深刻的感知，并愿意为守护集体价值而付出。","practice":"情绪中心未定义的人会吸收周遭的情绪波浪，容易在情绪高潮时做决定。无论你的情绪中心是否定义，都请在情绪完全沉淀之后再做重要决定。闸门49的智慧在于：学会与情绪的波浪共舞，而不是在波浪中做决定。✦ 你的革命需要在情绪清晰时才能被正确表达。","channel":"19-49 综合通道","oppId":19,"oppIching":"临 · 临近","keywords":["革命","原则","拒绝","改变","正义"],"emoji":"🌊"},{"id":50,"name":"价值守护的责任力量","nameEn":"The Cauldron","iching":"鼎 · 鼎器","center":"直觉中心","circuitKey":"tribal","circuitLabel":"家族人回路 · 防护","design":"守护部落的法律与价值观，是文明与道德传承的基石","talent":"闸门50位于直觉中心（Spleen），是「价值（Values）」的守护者。Ra 说：直觉中心往往被误解为「只有恐惧与生存」，但闸门50展示了直觉中心的「价值面向」——即，对「什么是有价值的的生活方式」有本能的知晓。闸门50与闸门27（滋养与关怀的生命力量）共同组成「27-50 保存通道」。27号提供「滋养与关怀」，50号提供「价值的守护」。这两条能量结合，让个人对生命资源的保存与分配有深刻的本能智慧，是天生的「守护者与滋养者」。","practice":"闸门50的「价值守护」不是「强加自己的价值观给别人」，而是「活出你所相信的价值」——当你的生活方式足够清晰时，他人会自然被吸引。定义的直觉中心拥有稳定的价值感；未定义的则会吸收环境中他人的价值压力，容易感到「我的价值不够好」的压力。智慧在于：允许自己活出你所相信的，而非试图让他人接受你的价值。","channel":"27-50 保存通道","oppId":27,"oppIching":"颐 · 颐养","keywords":["价值观","责任","法律","守护","传统"],"emoji":"🛡️"},{"id":51,"name":"震撼与发起的勇气力量","nameEn":"The Arousing / Shock","iching":"震 · 震动","center":"意志力中心","circuitKey":"indiv","circuitLabel":"个体人回路 · 觉知","design":"透过震撼与挑战来测试自己与他人，是在竞争中找到勇气与中心的力量","talent":"闸门51位于意志力中心，是「震撼（Shock）」的力量。Ra 说：意志力中心是人类图中「最容易被误解」的中心——人们以为它只关乎「控制与坚持」，但闸门51揭示了它的另一面：「为了发起新的行动而承担震撼」。闸门51与闸门25（天真的宇宙之爱）共同组成「25-51 启蒙通道」。25号提供「天真的初心」，51号提供「震撼与发起的勇气」。这两条能量结合，让个人带着纯真的初心去发起新的行动，在需要的时候展现出令人震撼的勇气与领导力。","practice":"认识这股能量的本质——它不是你需要\"努力变得更好\"的东西，而是你已经拥有的潜能。等待它的自然显现，而不是用意志去驱动它。✦ 当这股能量来自于你的本性时，它才有真正的力量。","channel":"25-51 启蒙通道","oppId":25,"oppIching":"无妄 · 无妄为","keywords":["震撼","勇气","竞争","发起","中心"],"emoji":"💪"},{"id":52,"name":"静止的力量","nameEn":"The Gate of Keeping Still","iching":"艮 · 止","center":"根部中心","circuitKey":"logic","circuitLabel":"集体人回路 · 理解","design":"在静止中积蓄力量，是专注与冥想的源泉，透过内在的宁静来影响外在","talent":"闸门52位于直觉中心（Spleen），是「静止（Stillness）」的力量。Ra 说：直觉中心往往被误解为「只有恐惧与行动」，但闸门52展示了直觉中心的「静止面向」——即，在行动之前，先「完全地静止下来」，然后行动会从这种静止中「自然而然地涌现」。闸门52与闸门9（专注细节的驯服力量）共同组成「9-52 专注通道」，位于逻辑头脑与直觉中心之间。9号提供「专注的细节」，52号提供「静止的力量」。这两条能量结合，让个人拥有将专注力转化为深层静止的天赋，在专注细节的过程中找到内在的宁静与集中。","practice":"闸门52的「静止」不是「偷懒」或「什么都不做」，而是「在行动之前，先完全地静止下来」——这是一种「蓄积能量」的静止，而非「耗尽能量」的懒惰。定义的直觉中心拥有稳定的静止能力；未定义则会吸收环境中他人的「行动压力」，容易感到「我必须做点什么」的焦虑。智慧在于：允许自己完全静止，并信任行动会从这种静止中自然涌现。","channel":"9-52 专注通道","oppId":9,"oppIching":"小畜 · 小的积累","keywords":["静止","专注","安静","沉思","压力"],"emoji":"⚡"},{"id":53,"name":"开始新周期的发展力量","nameEn":"The Gate of Beginnings","iching":"渐 · 渐进","center":"根部中心","circuitKey":"logic","circuitLabel":"集体人回路 · 感知","design":"携带开展新循环的驱动压力，是人生各阶段新开始的能量引擎","talent":"闸门53位于根部中心，是「开始（Beginning）」的力量。Ra 说：根部中心是所有「压力」的来源，而闸门53的压力是「为了开始新周期而承受的压力」。这不是关于「冲动地开始」，而是关于「在正确的时机，发起一个新的周期」。闸门53与闸门42（完成周期的成长力量）共同组成「42-53 成熟通道」，位于根部中心与荐骨中心之间。53号负责「开始」一个新周期，42号负责「完成」这个周期。这两条能量结合，让个人拥有「从开始到完成一个完整周期」的天赋。","practice":"根部中心的压力不是\"问题\"，而是\"燃料\"——它推动你采取行动、完成任务。定义的根部拥有稳定的压力驱动力；未定义的则会吸收他人的压力，容易感到\"我必须快点\"。闸门53的智慧在于：学会与压力共舞 ，而不是被压力逼促。当压力来临时，深呼吸，连接到你的内在权威，问：「这个压力是来自我的真实，还是来自外在的期待？」✦ 压力本身不是坏事，关键是你是否与它建立了正确的关系。","channel":"42-53 成熟通道","oppId":42,"oppIching":"益 · 增益","keywords":["开始","新周期","发展","压力","渐进"],"emoji":"⚡"},{"id":54,"name":"野心与转化的驱动力量","nameEn":"The Marrying Maiden","iching":"归妹 · 归嫁","center":"根部中心","circuitKey":"tribal","circuitLabel":"家族人回路 · 意志力","design":"是强烈的野心与向上蜕变的驱动力，在精神与物质两个层面推动自我超越","talent":"闸门54位于根部中心，是「野心（Ambition）」的力量。Ra 说：根部中心的压力往往让人「感到必须行动」，而闸门54的「野心」是「为了转化（Mutation）而承受的驱力」。这不是关于「个人成就」，而是关于「推动事物从潜能变为现实」。闸门54与闸门32（持续与延续的本能智慧）共同组成「32-54 蜕变通道」，位于直觉中心与根部中心之间。32号提供「持续的耐力」，54号提供「改变与转化的冲动」。这两条能量结合，让个人拥有「将野心持续转化为实际蜕变」的本能驱动力。","practice":"闸门54的「野心」不是「个人成就的渴望」，而是「为了转化而驱动的」——当你感知到某件事「可以被转化」时，你的根部中心会产生一股「必须去做」的驱力。定义的根部中心拥有稳定的野心驱力；未定义则会吸收环境中他人的野心压力，容易感到「我必须变得很有野心」的假象。智慧在于：辨认这股野心是不是你的，以及它是否为了「真正的转化」。","channel":"32-54 蜕变通道","oppId":32,"oppIching":"恒 · 恒久","keywords":["野心","转化","蜕变","向上","梦想"],"emoji":"⚡"},{"id":55,"name":"精神与丰盛的情绪力量","nameEn":"The Gate of Spirit","iching":"丰 · 丰盛","center":"情绪中心","circuitKey":"indiv","circuitLabel":"个体人回路 · 觉知","design":"是精神丰盛与情绪信念的承载者，透过情绪波浪连结灵魂与物质世界","talent":"闸门55位于情绪中心，是「精神（Spirit）」的力量。Ra 说：情绪中心往往被误解为「只有情绪波动」，但闸门55展示了情绪中心的「丰盛面向」——即，当情绪在正确的波浪中运作时，会涌现出「精神的丰盛感」。闸门55与闸门39（挑衅者的精神探索）共同组成「39-55 情绪通道」，位于根部中心与情绪中心之间。39号提供「精神探索的压力」，55号提供「精神丰盛的体验」。这两条能量结合，让个人拥有「在精神层面的挑衅与丰盛情绪之间建立深刻的连结」的天赋。","practice":"情绪中心未定义的人会吸收周遭的情绪波浪，容易在情绪高潮时做决定。无论你的情绪中心是否定义，都请在情绪完全沉淀之后再做重要决定。闸门55的智慧在于：学会与情绪的波浪共舞，而不是在波浪中做决定。✦ 你的精神需要在情绪清晰时才能被正确表达。","channel":"39-55 情绪通道","oppId":39,"oppIching":"蹇 · 险阻","keywords":["精神","丰盛","情绪波浪","信念","灵魂"],"emoji":"🌊"},{"id":56,"name":"漫游者的说故事力量","nameEn":"The Wanderer","iching":"旅 · 旅行","center":"喉轮中心","circuitKey":"logic","circuitLabel":"集体人回路 · 感知","design":"透过说故事来刺激与启发他人，是将生命体验转化为智慧语言的旅行者","talent":"闸门56位于喉轮中心，是「说故事（The Storyteller）」的力量。Ra 说：喉轮中心是「表达与显化」的中心，而闸门56的天赋在于「将内在的想法与概念转化为引人入胜的故事」。闸门56与闸门11（想法与概念化的和平力量）共同组成「11-56 好奇通道」，位于逻辑头脑与喉轮中心之间。11号产生「想法与概念」，56号负责「将想法转化为故事」。这两条能量结合，让个人拥有「将内在创意想法娓娓道来」的天赋，是天生的说书人。","practice":"闸门56的「说故事」不是「为了说话而说话」，而是「当内在有故事想要被分享时，自然地表达出来」。定义的喉轮中心拥有稳定的表达能力；未定义则会吸收环境中他人的表达压力，容易感到「我必须说点什么」的冲动。智慧在于：等待内在的故事自然成熟，然后再表达。勉强表达，只会让故事失去它的魔力。","channel":"11-56 好奇通道","oppId":11,"oppIching":"泰 · 和泰","keywords":["故事","旅行","好奇","刺激","启发"],"emoji":"🗣️"},{"id":57,"name":"直觉清晰的力量","nameEn":"The Gentle","iching":"巽 · 风","center":"直觉中心","circuitKey":"indiv","circuitLabel":"个体人回路 · 觉知","design":"最精准的当下直觉感知力，在瞬间辨别什么对生存有益或有害","talent":"闸门57位于直觉中心（Spleen），是「清晰（Intuition）」的力量。Ra 说：直觉中心是人类图中「最被误解」的中心之一——人们以为它只关乎「恐惧」，但闸门57展示了直觉中心的「清晰面向」——即，在当下的瞬间，「就是知道」什么是对的、什么是错的。闸门57可以连接三条通道：57-34（力量通道）、57-20（脑波通道）、57-10（完美形式通道）。这意味着闸门57的直觉清晰，可以透过「行动力量（34）、当下表达（20）、自我觉醒（10）」三种方式来展现。","practice":"闸门57的直觉是「当下的、瞬间的」——在某个瞬间，你的身体「就是知道」。这不是「思考出来的结论」，而是「身体层面的即时辨识」。定义的直觉中心拥有稳定的直觉清晰度；未定义则会吸收环境中他人的直觉压力，容易感到「我必须做出正确的决定」的焦虑。智慧在于：信任那个「瞬间就知道」的感觉，而非用大脑来「验证」它。","channel":"34-57 力量通道 / 20-57 脑波通道 / 10-57 完美形式通道","oppId":34,"oppIching":"大壮 · 大力","keywords":["直觉","清晰","当下","生存","洞察"],"emoji":"🛡️"},{"id":58,"name":"喜悦的活力","nameEn":"The Joyous","iching":"兑 · 喜悦","center":"根部中心","circuitKey":"logic","circuitLabel":"集体人回路 · 理解","design":"对生命充满喜悦与热爱，透过活力四射的能量推动事物走向完美","talent":"闸门58位于荐骨中心，是「喜悦（Joy）」的力量。Ra 说：荐骨中心是「生命力与持续能量」的中心，而闸门58的天赋在于「拥有持续的喜悦活力」——这不是「一时的快乐」，而是「来自生命本身的活力」。闸门58与闸门18（纠正与改善的品味力量）共同组成「18-58 批判通道」，位于直觉中心与荐骨中心之间。18号提供「纠正与改善的品味」，58号提供「喜悦的活力」。这两条能量结合，让个人能敏锐地察觉哪里需要改善，并拥有持续的动力去推动变革与提升。","practice":"闸门58的「喜悦」是「荐骨回应驱动的」，不是「意志力驱动的」。当你在正确的事情上投入时，你的荐骨会给出「喜悦的回应」——这是一种「全身感到活力」的感觉。定义的荐骨中心拥有稳定的喜悦活力；未定义则会吸收环境中他人的活力压力，容易感到「我必须保持很有活力的样子」的假象。智慧在于：辨认这股活力是不是来自荐骨的回应。","channel":"18-58 批判通道","oppId":18,"oppIching":"蛊 · 整治败坏","keywords":["喜悦","活力","热爱","完美","生命力"],"emoji":"⚡"},{"id":59,"name":"亲密与分散的力量","nameEn":"Dispersion","iching":"涣 · 涣散","center":"荐骨中心","circuitKey":"logic","circuitLabel":"集体人回路 · 感知","design":"透过打破界限来建立深度亲密连结，是推动生命繁衍与基因传递的力量","talent":"闸门59位于情绪中心，是「亲密（Intimacy）」的力量。Ra 说：情绪中心是关于「情绪的波浪式运作」的中心，而闸门59的天赋在于「能够打开情绪的门，去体验真正的亲密」。闸门59与闸门6（冲突与亲密的情绪守门员）共同组成「6-59 亲密通道」，位于情绪中心内部。6号是「守门员」，决定什么时候该打开门；59号是「打开的力量」，让亲密得以发生。这两条能量结合，是真正的「亲密关系之流」。","practice":"认识这股能量的本质——它不是你需要\"努力变得更好\"的东西，而是你已经拥有的潜能。等待它的自然显现，而不是用意志去驱动它。✦ 当这股能量来自于你的本性时，它才有真正的力量。","channel":"6-59 亲密通道","oppId":6,"oppIching":"讼 · 争讼","keywords":["亲密","分散","生育","突破界限","连结"],"emoji":"🔥"},{"id":60,"name":"接受限制的超越力量","nameEn":"Limitation","iching":"节 · 节制","center":"根部中心","circuitKey":"indiv","circuitLabel":"个体人回路 · 觉知","design":"透过接受限制来积蓄突变的能量，是在边界中找到创新突破的智慧","talent":"闸门60位于情绪中心，是「限制（Limitation）」的力量。Ra 说：情绪中心往往被误解为「只有情绪的波动」，但闸门60展示了情绪中心的「限制面向」——即，「为了接受限制，从而获得超越」。闸门60与闸门3（在混乱中建立新秩序）共同组成「3-60 突变通道」，位于荐骨中心与情绪中心之间。3号提供「在混乱中建立新秩序」的能量，60号提供「接受限制」的智慧。这两条能量结合，让个人成为「突变的推动者」——在看似混乱的限制中，催生出全新的可能性。","practice":"闸门60的「限制」不是「终点」，而是「超越的入口」。Ra 说：很多伟大的突变，都发生在「看似被限制住」的时刻——因为限制迫使你「放弃旧的方式」，然后「新的可能性」才能涌入。定义的情绪中心拥有稳定的「接受限制」能力；未定义则会吸收环境中他人的限制感，容易感到「我必须突破所有限制」的焦虑。智慧在于：辨别哪些限制是「为了超越而必须接受的」，哪些是需要被突破的。","channel":"3-60 突变通道","oppId":3,"oppIching":"屯 · 初始的困难","keywords":["限制","超越","接受","突变","保守"],"emoji":"⚡"},{"id":61,"name":"内在真理的神秘力量","nameEn":"Inner Truth","iching":"中孚 · 内在信实","center":"逻辑头脑","circuitKey":"indiv","circuitLabel":"个体人回路 · 觉知","design":"接收宇宙神秘真理的天线，透过内在知晓为世界带来无法言喻的洞见","talent":"闸门61位于逻辑头脑（Ajna），是「内在真理（Inner Truth）」的力量。Ra 说：逻辑头脑往往被误解为「只有思考和压力」，但闸门61展示了逻辑头脑的「神秘面向」——即，「内在有一种「知道真理」的神秘感觉」，但它无法被逻辑地证明。闸门61与闸门24（回归与合理化的心智力量）共同组成「24-61 觉察通道」，位于逻辑头脑内部。24号提供「回归与合理化」，61号提供「内在真理的神秘力量」。这两条能量结合，让个人能在静默的回归中，将内在的神秘洞察转化为可被理解的逻辑表达。","practice":"闸门61的「内在真理」是「神秘性的」，不是「逻辑可证明的」。有时候，你会「就是知道」某个真理，但你说不出来「为什么」。定义的闸门61拥有稳定的「内在真理感」；未定义则会吸收环境中他人的「真理压力」，容易感到「我的理解不够深刻」的压力。智慧在于：允许自己「知道但说不出来的真理」存在，而非试图用逻辑来证明它。","channel":"24-61 觉察通道","oppId":24,"oppIching":"复 · 回复","keywords":["内在真理","神秘","灵感","宇宙","知晓"],"emoji":"🧠"},{"id":62,"name":"细节的准备力量","nameEn":"The Preponderance of the Small","iching":"小过 · 小事谨慎","center":"喉轮中心","circuitKey":"logic","circuitLabel":"集体人回路 · 理解","design":"透过对细节的精准处理来将逻辑模式转化为可操作的事实与语言","talent":"闸门62位于喉轮中心，是「细节（Details）」的力量。Ra 说：喉轮中心是「表达与显化」的中心，而闸门62的天赋在于「能够将想法转化为精确而细致的表达」。闸门62与闸门17（逻辑意见的组织力量）共同组成「17-62 接纳通道」，位于逻辑头脑与喉轮中心之间。17号提供「逻辑意见的组织」，62号提供「细节的准备」。这两条能量结合，让个人能将内在的逻辑见解，以精确而细致的方式表达出来，影响他人的思考。","practice":"闸门62的「细节」是「为了精确表达而准备」，不是「为了完美主义而执着」。定义的喉轮中心拥有稳定的细节表达能力；未定义则会吸收环境中他人的表达压力，容易感到「我必须把所有细节都说清楚」的焦虑。智慧在于：细节是「为了表达更精确」，而非「为了证明自己很厉害」。如果你在「为了细节而错过了整体」，那可能不是闸门62的正确运作。","channel":"17-62 接纳通道","oppId":17,"oppIching":"随 · 随从","keywords":["细节","准备","谨慎","事实","逻辑"],"emoji":"🗣️"},{"id":63,"name":"怀疑与好奇的智慧力量","nameEn":"Doubt","iching":"既济 · 已成","center":"逻辑头脑","circuitKey":"logic","circuitLabel":"集体人回路 · 理解","design":"透过理性怀疑来驱动逻辑思考，是已完成的模式中寻找改善空间的力量","talent":"闸门63位于逻辑头脑（Ajna），是「怀疑（Doubt）」的力量。Ra 说：逻辑头脑的压力往往让人「想太多」，但闸门63的「怀疑」是「为了产生好奇，从而开始探索」——这不是「不信任」，而是「健康的怀疑精神」。闸门63与闸门4（公式化的逻辑心智）共同组成「4-63 逻辑通道」，位于逻辑头脑内部。4号提供「公式化」，63号提供「怀疑与好奇」。这两条能量结合，让个人拥有「将怀疑转化为系统化的探索」的天赋。","practice":"脑中心不是「觉知」的中心，而是「思维加工」的中心。定义的脑中心拥有稳定的思考模式；未定义的则会吸收他人的思考压力，容易陷入\"过度思考\"。闸门63的怀疑需要被充分思考成熟后再表达。不要在有压力时急于得出结论。给你的思维充分的时间，让它自然地沉淀出答案。✦ 思考本身不是问题，问题是用思考来代替内在权威做决定。","channel":"4-63 逻辑通道","oppId":4,"oppIching":"蒙 · 蒙昧","keywords":["怀疑","好奇","逻辑","质疑","已完成"],"emoji":"🧠"},{"id":64,"name":"困惑中的灵感之源","nameEn":"Before Completion","iching":"未济 · 未完成","center":"逻辑头脑","circuitKey":"logic","circuitLabel":"集体人回路 · 感知","design":"在困惑与压力中接收无限的可能性与灵感，是尚未成形的潜力场域","talent":"闸门64位于逻辑头脑（Ajna），是「困惑（Confusion）」的力量。Ra 说：逻辑头脑的压力往往让人「想要得出清晰的结论」，但闸门64的「困惑」是「为了等待灵感，而承受的必要的困惑期」。闸门64与闸门47（压抑与领悟的智慧力量）共同组成「47-64 抽象通道」，位于逻辑头脑内部。47号提供「压抑与领悟」，64号提供「困惑中的灵感」。这两条能量结合，让个人能在思维的困惑与压抑中，等待并捕捉突然涌现的抽象灵感，并将其转化为理解。","practice":"闸门64的「困惑」不是「脑子有问题」，而是「灵感涌现之前的必要过程」。就像雷雨云在降雨之前会看起来很「困惑」——很多能量在酝酿，但还没有「释放」。定义的闸门64拥有稳定的「灵感节奏」；未定义则会吸收环境中他人的「困惑压力」，容易感到「我必须现在就想清楚」的焦虑。智慧在于：允许自己「困惑」，并信任灵感会在正确的时刻自然涌现。","channel":"47-64 抽象通道","oppId":47,"oppIching":"困 · 困境","keywords":["困惑","灵感","压力","未完成","可能性"],"emoji":"🧠"}];

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function cardHTML(g){
  return '<article class="card" data-ck="' + g.circuitKey + '" id="gate-' + g.id + '">'
    + '<div class="top">'
    +   '<div class="num"><small>闸门</small>' + g.id + '</div>'
    +   '<div><h2>' + esc(g.name) + '<span class="gates">闸门 ' + g.id + '</span></h2>'
    +   '<div class="design">' + esc(g.design) + '</div></div>'
    +   '<div class="emoji">' + g.emoji + '</div>'
    + '</div>'
    + '<div class="meta">'
    +   '<span class="chip ck">' + esc(g.circuitLabel) + '</span>'
    +   '<span class="chip">⚡ ' + esc(g.center) + '</span>'
    +   '<span class="chip">☰ ' + esc(g.iching) + '</span>'
    + '</div>'
    + '<div class="gaterow">'
    +   '<div class="gate"><div class="gn">闸门 ' + g.id + '</div><div class="gx">' + esc(g.iching) + '</div><div class="gl">' + esc(g.nameEn) + '</div></div>'
    +   '<div class="link"><span>⇄</span><div class="ln"></div></div>'
    +   '<div class="gate"><div class="gn">对宫闸门 ' + g.oppId + '</div><div class="gx">' + esc(g.oppIching) + '</div><div class="gl">通道 ' + esc(g.channel) + '</div></div>'
    + '</div>'
    + '<p class="para"><span class="lead">天赋描述</span>' + esc(g.talent) + '</p>'
    + '<p class="para"><span class="lead">实践建议</span>' + esc(g.practice) + '</p>'
    + '<div class="kw"><span class="kt">关键词</span>' + g.keywords.map(function(k){ return '<i>' + esc(k) + '</i>'; }).join('') + '</div>'
    + '</article>';
}

function render(filter){
  var box = document.getElementById("cards");
  var html = "";
  GATES.forEach(function(g){
    if(!filter || filter==="all" || g.circuitKey===filter) html += cardHTML(g);
  });
  box.innerHTML = html;
}

function renderFilters(){
  var fs = [
    {k:"all", t:"全部 64 闸门"},
    {k:"indiv", t:"个体人·觉知"},
    {k:"logic", t:"集体人·理解/感知"},
    {k:"tribal", t:"家族人·防护/意志力"}
  ];
  var box = document.getElementById("filters");
  box.innerHTML = fs.map(function(f,i){
    return '<button data-k="' + f.k + '" class="' + (i===0?"on":"") + '">' + f.t + '</button>';
  }).join("");
  box.addEventListener("click", function(e){
    var b = e.target.closest("button");
    if(!b) return;
    box.querySelectorAll("button").forEach(function(x){x.classList.remove("on");});
    b.classList.add("on");
    render(b.getAttribute("data-k"));
  });
}

  document.title = "64 闸门知识卡片 · " + VERSION;

    '<span class="src">资料来源：人类图 64 闸门知识库</span><br>' +
    '<span class="src">Powered by Kan Man Tang</span>';
  renderFilters();
  render("all");
}
